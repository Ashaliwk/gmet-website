<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="urbanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111d13"/>
      <stop offset="60%" stop-color="#182c1e"/>
      <stop offset="100%" stop-color="#243e2b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#urbanGrad)"/>
  <!-- Street Grid & Urban Blocks -->
  <g stroke="#3a5a40" stroke-width="1.5" opacity="0.6">
    <line x1="80" y1="120" x2="720" y2="120"/>
    <line x1="80" y1="200" x2="720" y2="200"/>
    <line x1="80" y1="280" x2="720" y2="280"/>
    <line x1="80" y1="360" x2="720" y2="360"/>
    <line x1="80" y1="440" x2="720" y2="440"/>
    
    <line x1="120" y1="80" x2="120" y2="480"/>
    <line x1="240" y1="80" x2="240" y2="480"/>
    <line x1="360" y1="80" x2="360" y2="480"/>
    <line x1="480" y1="80" x2="480" y2="480"/>
    <line x1="600" y1="80" x2="600" y2="480"/>
  </g>
  <!-- Change Detection Highlight Zones -->
  <!-- Zone A: New Construction (Red Alert) -->
  <rect x="250" y="210" width="100" height="60" fill="#e63946" opacity="0.75" stroke="#ff4d6d" stroke-width="2"/>
  <rect x="370" y="130" width="100" height="60" fill="#e63946" opacity="0.75" stroke="#ff4d6d" stroke-width="2"/>
  <!-- Zone B: Infrastructure Road Expansion (Yellow/Orange Alert) -->
  <path d="M 120,440 L 480,280 L 720,280" stroke="#fca311" stroke-width="6" fill="none" opacity="0.8" stroke-dasharray="12,6"/>
  <!-- Zone C: Vegetation Loss (Cyan/Green transition) -->
  <rect x="490" y="290" width="100" height="60" fill="#457b9d" opacity="0.6" stroke="#a8dadc" stroke-width="1.5"/>

  <!-- Change Detection Overlay HUD -->
  <g transform="translate(560, 360)">
    <rect x="0" y="0" width="200" height="95" rx="8" fill="rgba(10,25,14,0.9)" stroke="#52b788" stroke-width="1"/>
    <circle cx="18" cy="22" r="6" fill="#e63946"/>
    <text x="32" y="26" fill="#ffffff" font-family="sans-serif" font-weight="600" font-size="11">New Built-Up (+28.4%)</text>
    <circle cx="18" cy="46" r="6" fill="#fca311"/>
    <text x="32" y="50" fill="#ffffff" font-family="sans-serif" font-weight="600" font-size="11">Transport Corridors</text>
    <circle cx="18" cy="70" r="6" fill="#457b9d"/>
    <text x="32" y="74" fill="#ffffff" font-family="sans-serif" font-weight="600" font-size="11">LULC Transition Area</text>
  </g>
  
  <text x="40" y="60" fill="#a7c957" font-family="monospace" font-size="14" letter-spacing="2">GMET // TEMPORAL CHANGE DETECTION</text>
  <text x="40" y="88" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="24">Urban Expansion &amp; Infrastructure Tracking</text>
  <rect x="40" y="105" width="150" height="26" rx="4" fill="#1b4332" stroke="#52b788" stroke-width="1"/>
  <text x="50" y="122" fill="#d8f3dc" font-family="monospace" font-size="12">AI CHANGE MATRIX</text>
</svg>
