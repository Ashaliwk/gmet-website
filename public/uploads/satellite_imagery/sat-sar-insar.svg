<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="60%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#123b1d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sarGrad)"/>
  <!-- Radar Interferometric Fringe Waves -->
  <g fill="none" stroke-width="2.5" opacity="0.65">
    <ellipse cx="400" cy="270" rx="340" ry="160" stroke="#48cae4"/>
    <ellipse cx="400" cy="270" rx="280" ry="130" stroke="#0077b6"/>
    <ellipse cx="400" cy="270" rx="220" ry="100" stroke="#023e8a"/>
    <ellipse cx="400" cy="270" rx="160" ry="70" stroke="#52b788"/>
    <ellipse cx="400" cy="270" rx="100" ry="45" stroke="#ffd166"/>
    <ellipse cx="400" cy="270" rx="50" ry="22" stroke="#ef476f"/>
  </g>
  <!-- PS-InSAR Scatterer Points -->
  <g fill="#ffd166">
    <circle cx="360" cy="250" r="3"/>
    <circle cx="380" cy="280" r="3.5"/>
    <circle cx="410" cy="265" r="4" fill="#ef476f"/>
    <circle cx="430" cy="245" r="3"/>
    <circle cx="400" cy="290" r="3.5" fill="#ef476f"/>
    <circle cx="450" cy="275" r="3"/>
    <circle cx="330" cy="270" r="3"/>
  </g>
  <!-- HUD Specs -->
  <text x="40" y="60" fill="#48cae4" font-family="monospace" font-size="14" letter-spacing="2">GMET // SAR INTERFEROMETRY (InSAR)</text>
  <text x="40" y="88" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="24">Ground Subsidence &amp; Slope Stability Monitoring</text>
  <rect x="40" y="105" width="160" height="26" rx="4" fill="#1c2541" stroke="#48cae4" stroke-width="1"/>
  <text x="50" y="122" fill="#caf0f8" font-family="monospace" font-size="12">PS-InSAR RADAR (C &amp; X)</text>
  <!-- InSAR Deformation Scale -->
  <g transform="translate(560, 360)">
    <rect x="0" y="0" width="200" height="95" rx="8" fill="rgba(11,19,43,0.9)" stroke="#48cae4" stroke-width="1"/>
    <text x="14" y="24" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="11">DISPLACEMENT VELOCITY</text>
    <defs>
      <linearGradient id="insarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#ef476f"/>
        <stop offset="50%" stop-color="#ffd166"/>
        <stop offset="100%" stop-color="#48cae4"/>
      </linearGradient>
    </defs>
    <rect x="14" y="34" width="172" height="12" rx="3" fill="url(#insarGrad)"/>
    <text x="14" y="64" fill="#ef476f" font-family="monospace" font-size="10">-24 mm/yr</text>
    <text x="140" y="64" fill="#48cae4" font-family="monospace" font-size="10">+5 mm/yr</text>
    <text x="14" y="82" fill="#caf0f8" font-family="monospace" font-size="10">PRECISION: +/- 1.2 mm</text>
  </g>
</svg>
