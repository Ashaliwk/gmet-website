<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#123b1d"/>
      <stop offset="100%" stop-color="#1f5d2b"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#55c57a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#55c57a" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="demGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f5d2b"/>
      <stop offset="50%" stop-color="#e0a96d"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#skyGrad)"/>
  <!-- Topographic Contour Lines -->
  <path d="M-50,320 Q120,240 280,300 T620,280 T850,310 L850,550 L-50,550 Z" fill="#143e20" opacity="0.7"/>
  <path d="M-50,370 Q160,290 340,360 T700,330 T850,380 L850,550 L-50,550 Z" fill="#0f2e18" opacity="0.8"/>
  <path d="M-50,420 Q200,360 420,410 T780,390 T850,430 L850,550 L-50,550 Z" fill="#0a1f10"/>
  <!-- 3D Terrain Wireframe Overlay -->
  <g stroke="#52b788" stroke-width="0.8" opacity="0.35" fill="none">
    <path d="M 50,450 L 250,260 L 550,290 L 750,450" />
    <path d="M 120,470 L 300,240 L 600,270 L 780,470" />
    <path d="M 20,430 L 220,280 L 500,310 L 700,430" />
    <path d="M 250,260 L 300,240 M 550,290 L 600,270" />
    <line x1="100" y1="100" x2="100" y2="400" stroke-dasharray="4,4"/>
    <line x1="300" y1="80" x2="300" y2="400" stroke-dasharray="4,4"/>
    <line x1="500" y1="80" x2="500" y2="400" stroke-dasharray="4,4"/>
    <line x1="700" y1="100" x2="700" y2="400" stroke-dasharray="4,4"/>
  </g>
  <!-- Orbiting Satellite Illustration -->
  <g transform="translate(620, 110)">
    <circle cx="0" cy="0" r="40" fill="#52b788" opacity="0.1"/>
    <!-- Solar Panels -->
    <rect x="-85" y="-12" width="55" height="24" rx="3" fill="#1b4965" stroke="#64dfdf" stroke-width="1.5"/>
    <line x1="-58" y1="-12" x2="-58" y2="12" stroke="#64dfdf" stroke-width="1"/>
    <rect x="30" y="-12" width="55" height="24" rx="3" fill="#1b4965" stroke="#64dfdf" stroke-width="1.5"/>
    <line x1="58" y1="-12" x2="58" y2="12" stroke="#64dfdf" stroke-width="1"/>
    <!-- Satellite Body -->
    <rect x="-24" y="-20" width="48" height="40" rx="6" fill="#f8f9fa" stroke="#c0c0c0" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="8" fill="#ffd166"/>
    <!-- Sensor Beam Cone -->
    <polygon points="-8,20 8,20 120,260 -180,260" fill="url(#gridGrad)"/>
    <line x1="0" y1="20" x2="-30" y2="260" stroke="#52b788" stroke-width="1.5" stroke-dasharray="5,5"/>
  </g>
  <!-- HUD & Coordinate Labels -->
  <text x="40" y="60" fill="#a7c957" font-family="monospace" font-size="14" letter-spacing="2">GMET // SATELLITE STEREO DEM ACQUISITION</text>
  <text x="40" y="85" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="24">0.3m Ultra-HD Stereo Pair</text>
  <rect x="40" y="105" width="130" height="26" rx="4" fill="#1f5d2b" opacity="0.8"/>
  <text x="50" y="122" fill="#ffffff" font-family="monospace" font-size="12">GSD: 30 CM STEREO</text>
  <!-- Reticle -->
  <circle cx="400" cy="270" r="28" stroke="#52b788" stroke-width="1.5" fill="none" opacity="0.6"/>
  <line x1="400" y1="235" x2="400" y2="305" stroke="#52b788" stroke-width="1.2" opacity="0.7"/>
  <line x1="365" y1="270" x2="435" y2="270" stroke="#52b788" stroke-width="1.2" opacity="0.7"/>
  <text x="412" y="262" fill="#52b788" font-family="monospace" font-size="10">ELEV: +1,248m</text>
</svg>
